name: Release Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and release qwqnt-better-anti-recall.zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史和 tag 才能算出上一个 tag 到本次 tag 的 commit 区间
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # tag 为准：把 package.json 的 version 对齐到 tag，避免产物里带着旧版本号。
      # 只改工作区，不提交回仓库。
      - name: Sync package.json version from tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf-8"));
            const next = process.argv[1];
            if (pkg.version !== next) {
              console.log(`package.json version ${pkg.version} -> ${next}`);
              pkg.version = next;
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            } else {
              console.log(`package.json version already ${next}`);
            }
          ' "$TAG_VERSION"

      - name: Collect commits since previous tag
        id: changelog
        run: |
          CUR="${GITHUB_REF_NAME}"
          # 找出祖先里最近的那个 tag；没有则从首个 commit 起算
          PREV=$(git tag --sort=-v:refname | grep -v "^${CUR}$" | while read -r t; do
            if git merge-base --is-ancestor "$t" "$CUR" 2>/dev/null; then echo "$t"; break; fi
          done)

          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${CUR}"
            echo "range: $RANGE"
          else
            RANGE="$CUR"
            echo "range: 从首个 commit 到 $CUR"
          fi

          {
            echo "body<<CHANGELOG_EOF"
            echo "## 本次改动"
            echo
            git log --no-merges --pretty='- %s (%h)' "$RANGE"
            if [ -n "$PREV" ]; then
              echo
              echo "**完整对比**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${CUR}"
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create release and upload zip
        uses: softprops/action-gh-release@v2
        with:
          files: qwqnt-better-anti-recall.zip
          # body 在前，GitHub 自动生成的 notes 追加在其后
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: true
